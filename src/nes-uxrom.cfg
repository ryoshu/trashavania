# Linker configuration for Mapper 2 (UxROM), CHR RAM.
# 4x16KB PRG banks: bank 0-2 switchable at $8000-$BFFF (currently unused,
# reserved for room/content banking), bank 3 fixed at $C000-$FFFF holding
# startup code, vectors, and all program code/data for now.
#
# Internal 2KB RAM layout:
#   $0000-$00FF  zero page (cc65 runtime + our fast-access vars)
#   $0100-$01FF  hardware stack (implicit, not memory-mapped here)
#   $0200-$02FF  OAM shadow buffer (page-aligned, required for OAM DMA)
#   $0300-$04FF  BSS (our globals)
#   $0500-$07FF  cc65 parameter stack

MEMORY {
    ZP:      file = "", start = $0002, size = $00FE, type = rw, define = yes;

    HEADER:  file = %O, start = $0000, size = $0010, fill = yes;

    PRG0:    file = %O, start = $8000, size = $4000, fill = yes, define = yes;
    PRG1:    file = %O, start = $8000, size = $4000, fill = yes, define = yes;
    PRG2:    file = %O, start = $8000, size = $4000, fill = yes, define = yes;
    PRGF:    file = %O, start = $C000, size = $3FFA, fill = yes, define = yes;
    VECTORS: file = %O, start = $FFFA, size = $0006, fill = yes;

    OAM:     file = "", start = $0200, size = $0100, define = yes;
    RAM:     file = "", start = $0300, size = $0200, define = yes;
    PSTACK:  file = "", start = $0500, size = $0300, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,               type = zp;
    HEADER:   load = HEADER,           type = ro;
    STARTUP:  load = PRGF,             type = ro,  define = yes;
    CODE:     load = PRGF,             type = ro,  define = yes;
    RODATA:   load = PRGF,             type = ro,  define = yes;
    DATA:     load = PRGF, run = RAM,  type = rw,  define = yes;
    VECTORS:  load = VECTORS,          type = rw;
    OAM_BUF:  load = OAM,              type = bss, define = yes;
    BSS:      load = RAM,              type = bss, define = yes;

    # bank 0-2 reserved for future room/content data (unused for now,
    # linker fills them so the ROM stays a valid fixed size)
    PRGBANK0: load = PRG0,             type = ro,  optional = yes;
    PRGBANK1: load = PRG1,             type = ro,  optional = yes;
    PRGBANK2: load = PRG2,             type = ro,  optional = yes;
}
